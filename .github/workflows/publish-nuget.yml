name: Publish NuGet package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test package
        run: dotnet test dotnet/Ikonym.Tests/Ikonym.Tests.csproj --configuration Release

      - name: Pack NuGet package
        run: dotnet pack dotnet/Ikonym/Ikonym.csproj --configuration Release --output artifacts

      - name: Request short-lived NuGet API key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: numera11y

      - name: Push package to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://www.nuget.org/api/v2/package --skip-duplicate
