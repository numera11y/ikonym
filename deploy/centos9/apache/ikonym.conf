# Apache 2.4 static-site vhosts for CentOS 9.
# Replace ikonym.numera11y.fr and the certificate paths if you use another domain.

<VirtualHost *:80>
    ServerName ikonym.numera11y.fr
    DocumentRoot "/var/www/ikonym"

    Redirect permanent / https://ikonym.numera11y.fr/

    ErrorLog /var/log/httpd/ikonym_http_error.log
    CustomLog /var/log/httpd/ikonym_http_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ikonym.numera11y.fr
    DocumentRoot "/var/www/ikonym"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ikonym.numera11y.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ikonym.numera11y.fr/privkey.pem

    <Directory "/var/www/ikonym">
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog /var/log/httpd/ikonym_https_error.log
    CustomLog /var/log/httpd/ikonym_https_access.log combined
</VirtualHost>
